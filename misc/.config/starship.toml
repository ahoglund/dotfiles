# Starship prompt configuration
# Docs: https://starship.rs/config/

format = """
$directory\
$git_branch\
$git_status\
$ruby\
$golang\
$nodejs\
$rust\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "~"
staged = "+"
deleted = "✘"
style = "bold red"

[ruby]
symbol = " "
style = "bold red"

[golang]
symbol = " "
style = "bold cyan"

[nodejs]
symbol = " "
style = "bold green"

[rust]
symbol = " "
style = "bold orange"

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
